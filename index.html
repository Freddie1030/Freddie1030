<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjay Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4fff5;
}

header{
background:#2e7d32;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
font-size:28px;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
}

.hero{
text-align:center;
padding:50px;
background:linear-gradient(#4caf50,#81c784);
color:white;
}

.hero button{
padding:12px 25px;
margin-top:20px;
border:none;
background:white;
color:#2e7d32;
font-size:18px;
cursor:pointer;
border-radius:5px;
}

.search{
text-align:center;
margin:20px;
}

.search input{
width:300px;
padding:10px;
font-size:18px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:180px;
height:180px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin:10px;
}

.price{
font-size:22px;
color:green;
font-weight:bold;
}

button{
padding:10px 20px;
background:green;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
margin-top:10px;
}

button:hover{
background:#1b5e20;
}

.cart{
position:fixed;
top:20px;
right:20px;
background:#ff9800;
padding:10px;
color:white;
border-radius:10px;
font-weight:bold;
}

footer{
margin-top:40px;
background:#2e7d32;
color:white;
text-align:center;
padding:20px;
}
</style>

</head>

<body>

<header>

<h2>🌿 Plant Store</h2>

<nav>

<a href="#">Home</a>

<a href="#">Plants</a>

<a href="#">Contact</a>

</nav>

</header>

<div class="cart">
🛒 Cart:
<span id="count">0</span>
</div>

<section class="hero">

<h1>Bring Nature Home</h1>

<p>Best Indoor & Outdoor Plants</p>

<button onclick="scrollToProducts()">
Shop Now
</button>

</section>

<div class="search">

<input
type="text"
placeholder="Search Plant"
id="search"
onkeyup="searchPlant()">

</div>

<section class="products" id="products">

</section>

<footer>

<h3>Plant Store</h3>

<p>Made with HTML CSS JavaScript</p>

</footer>

<script>

const plants=[

{
name:"Snake Plant",
price:350,
image:"https://images.unsplash.com/photo-1545241047-6083a3684587?w=400"
},

{
name:"Aloe Vera",
price:250,
image:"https://images.unsplash.com/photo-1463320726281-696a485928c7?w=400"
},

{
name:"Money Plant",
price:180,
image:"https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=400"
},

{
name:"Peace Lily",
price:450,
image:"https://images.unsplash.com/photo-1463936575829-25148e1db1b8?w=400"
},

{
name:"Cactus",
price:300,
image:"https://images.unsplash.com/photo-1459156212016-c812468e2115?w=400"
},

{
name:"Spider Plant",
price:280,
image:"https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=400"
}

];

let cart=0;

function display(list){

let html="";

list.forEach(p=>{

html+=`

<div class="card">

<img src="${p.image}">

<h3>${p.name}</h3>

<div class="price">₹${p.price}</div>

<button onclick="addCart()">

Add to Cart

</button>

</div>

`;

});

document.getElementById("products").innerHTML=html;

}

display(plants);

function addCart(){

cart++;

document.getElementById("count").innerHTML=cart;

}

function searchPlant(){

let value=document.getElementById("search").value.toLowerCase();

let filtered=plants.filter(item=>

item.name.toLowerCase().includes(value)

);

display(filtered);

}

function scrollToProducts(){

document.getElementById("products").scrollIntoView({

behavior:"smooth"

});

}

</script>

</body>
</html>
